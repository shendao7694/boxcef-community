<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="BOXCEF 是一个社区平台，你可以在这里发布帖子、分享作品，并与他人交流。">
<meta name="keywords" content="BOXCEF">
<title>个人资料</title>
<link rel="stylesheet" href="./src/style/common/global.css">
<link rel="stylesheet" href="./src/style/common/toast.css">
<link rel="stylesheet" href="./src/style/profile.css">
<link rel="icon" type="image/png" href="./assets/favicon.png">
</head>
<body>
<nav class="nav">
  <a class="nav-brand" href="/">BOXCEF</a>
  <div class="nav-actions">
    <a id="nav-publish" class="btn btn-ghost" href="/disc.html">个人图盘</a>
    <button id="friends-btn" class="btn btn-ghost">好友</button>
    <button id="theme-toggle" class="theme-toggle" aria-label="切换主题">
      <svg id="sun-icon" class="icon" viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z"/></svg>
      <svg id="moon-icon" class="icon" viewBox="0 0 24 24" style="display:none"><path d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.7-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z"/></svg>
    </button>
  </div>
</nav>

<main class="profile-wrap">
  <section class="profile-card">
    <div class="profile-side">
      <div class="avatar-box">
        <img id="avatar-img" alt="avatar">
      </div>
      <button id="edit-btn" class="btn btn-ghost" style="width:100%">编辑资料</button>

      <div class="meta">
        <div class="meta-row"><span>用户名</span><b id="meta-name">-</b></div>
        <div class="meta-row"><span>昵称</span><b id="meta-nickname">-</b></div>
        <div class="meta-row"><span>用户组</span><b id="meta-group">-</b></div>
        <div class="meta-row"><span>最近登录</span><b id="meta-login">-</b></div>
      </div>

      <div class="side-desc">
        <div class="side-desc-title">简介</div>
        <div class="side-desc-body" id="side-desc">还没有填写简介</div>
      </div>
    </div>

    <div class="profile-main">
      
      <h2 class="posts-title">我的帖子</h2>
      <div class="posts-box" id="posts-box">
        <div class="empty-text">加载中...</div>
      </div>

      
      <h2 class="posts-title" style="margin-top: 32px;">我的作品</h2>
      <div class="posts-box" id="boxplays-box">
        <div class="empty-text">加载中...</div>
      </div>
    </div>
  </section>
</main>


<div id="edit-modal" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h2>编辑资料</h2>
      <button type="button" class="btn btn-ghost" id="edit-close">关闭</button>
    </div>

    <div class="edit-avatar-row">
      <div class="edit-avatar-box">
        <img id="edit-avatar-preview" alt="avatar">
      </div>
      <div class="edit-avatar-actions">
        <button type="button" class="btn btn-ghost" id="edit-upload-btn">更换头像</button>
        <input type="file" id="edit-avatar-input" accept="image/*" hidden>
      </div>
    </div>

    <form id="edit-form" novalidate>
      <div class="input-group">
        <label for="edit-nickname">昵称</label>
        <input type="text" id="edit-nickname" maxlength="20" required>
      </div>
      <div class="input-group">
        <label for="edit-description">简介</label>
        <textarea id="edit-description" rows="4" maxlength="200"></textarea>
      </div>
      <div class="side-title">
        <div class="side-desc-title">我的头衔</div>
        <div class="title-picker" id="title-picker"></div>
      </div>
      <div class="input-group">
        <label>邮箱（不可修改）</label>
        <input type="email" id="edit-email" disabled>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="edit-cancel">取消</button>
        <button type="submit" class="btn" id="edit-save">保存修改</button>
      </div>
    </form>
  </div>
</div>


<div id="friends-modal" class="modal" hidden>
  <div class="modal-card modal-wide">
    <div class="modal-head">
      <h2>好友</h2>
      <button type="button" class="btn btn-ghost" id="f-close">关闭</button>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="mutual">好友</button>
      <button class="tab" data-tab="followers">粉丝</button>
      <button class="tab" data-tab="following">关注</button>
      <button class="tab" data-tab="search">搜索</button>
    </div>
    <div id="f-search-row" class="search-row" hidden>
      <input type="text" id="f-search-input" placeholder="搜索名字或昵称">
      <button class="btn" id="f-search-btn">搜索</button>
    </div>
    <div id="f-list" class="friend-list"></div>
  </div>
</div>

<script type="module" src="./src/js/common/theme.js"></script>
<script type="module" src="./src/js/common/nav.js"></script>
<script type="module" src="./src/js/profile.js"></script>
</body>
</html>
