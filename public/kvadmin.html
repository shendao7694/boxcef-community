<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<meta name="description" content="BOXCEF 是一个社区平台，你可以在这里发布帖子、分享作品，并与他人交流。">
<meta name="keywords" content="BOXCEF">
<title>KV Admin Page</title>
<link rel="stylesheet" href="./src/style/common/global.css">
<link rel="stylesheet" href="./src/style/common/toast.css">
<link rel="stylesheet" href="./src/style/kvadmin.css">
<link rel="icon" type="image/png" href="./assets/favicon.png">
</head>
<body>
<nav class="nav">
  <a class="nav-brand" href="/">BOXCEF</a>
  <div class="nav-actions">
    <button id="theme-toggle" class="theme-toggle" aria-label="切换主题">
      <svg id="sun-icon" class="icon" viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z"/></svg>
      <svg id="moon-icon" class="icon" viewBox="0 0 24 24" style="display:none"><path d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.7-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z"/></svg>
    </button>
  </div>
</nav>

<div id="login-view" class="auth-wrap">
  <div class="auth-card">
    <h1>KV Admin</h1>
    <p class="subtitle">直接管理 KV 数据，请谨慎操作</p>
    <div class="input-group">
      <label for="admin-token">Admin Token</label>
      <input type="password" id="admin-token" autocomplete="off" placeholder="Bearer token">
    </div>
    <button class="btn" style="width:100%" id="login-btn">进入</button>
  </div>
</div>

<main id="panel-view" class="kv-wrap" hidden>
  <aside class="kv-side">
    <div class="kv-binding-tabs" id="binding-tabs">
      <button class="kv-tab active" data-binding="Community-Service">Service</button>
      <button class="kv-tab" data-binding="Community-Assets">Assets</button>
      <button class="kv-tab" data-binding="Community-Works">Works</button>
      <button class="kv-tab" data-binding="Community-Users">Users</button>
    </div>

    <div class="kv-side-actions">
      <input type="text" id="prefix-input" class="kv-input" placeholder="prefix（可选）">
      <button class="btn btn-ghost btn-sm" id="refresh-btn">刷新</button>
    </div>

    <div class="kv-key-list" id="key-list">
      <div class="empty-text">请输入 token 后加载</div>
    </div>

    <div class="kv-key-list-footer">
      <button class="btn btn-ghost btn-sm" id="load-more-btn" hidden>加载更多</button>
      <span class="kv-count" id="key-count">0</span>
    </div>
  </aside>

  <section class="kv-main">
    <div class="kv-main-head">
      <input type="text" id="edit-key" class="kv-input mono" placeholder="key">
      <div class="kv-main-actions">
        <button class="btn btn-ghost btn-sm" id="new-btn">新建</button>
        <button class="btn btn-ghost btn-sm" id="reload-btn">读取</button>
        <button class="btn btn-sm" id="save-btn">保存</button>
        <button class="btn btn-danger btn-sm" id="delete-btn">删除</button>
      </div>
    </div>

    <div class="kv-meta" id="kv-meta"></div>

    <div class="kv-tabs-row">
      <button class="kv-value-tab active" data-mode="text">文本</button>
      <button class="kv-value-tab" data-mode="json">JSON 美化</button>
      <button class="kv-value-tab" data-mode="base64">Base64 预览</button>
    </div>

    <textarea id="edit-value" class="kv-textarea mono" spellcheck="false" placeholder="value"></textarea>
  </section>
</main>

<script type="module" src="./src/js/common/theme.js"></script>
<script type="module" src="./src/js/kvadmin.js"></script>
</body>
</html>
