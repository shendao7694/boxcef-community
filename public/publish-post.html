<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="BOXCEF 是一个社区平台，你可以在这里发布帖子、分享作品，并与他人交流。">
<meta name="keywords" content="BOXCEF">
<title>发布帖子</title>
<link rel="stylesheet" href="./src/style/common/global.css">
<link rel="stylesheet" href="./src/style/common/toast.css">
<link rel="stylesheet" href="./src/style/publish-post.css">
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<link rel="icon" type="image/png" href="./assets/favicon.png">
</head>
<body>
<nav class="nav">
  <a class="nav-brand" href="/">BOXCEF</a>
  <div class="nav-actions">
    <button id="theme-toggle" class="theme-toggle" aria-label="切换主题">
      <svg id="sun-icon" class="icon" viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z"/></svg>
      <svg id="moon-icon" class="icon" viewBox="0 0 24 24" style="display:none"><path d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.7-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z"/></svg>
    </button>
  </div>
</nav>

<main class="publish-wrap">
  <section class="publish-card">
    <div class="publish-head">
      <h1>发布帖子</h1>
      <button class="btn" id="publish-btn">发布</button>
    </div>

    <div class="input-group">
      <label for="p-title">标题</label>
      <input type="text" id="p-title" maxlength="100" placeholder="可选">
    </div>

    <div class="input-group">
      <label>分类（可多选，最多 5 个）</label>
      <div id="tag-picker" class="tag-picker"></div>
    </div>

    <div class="editor-toolbar">
      <button class="btn btn-ghost btn-sm" data-insert="**|**">粗体</button>
      <button class="btn btn-ghost btn-sm" data-insert="*|*">斜体</button>
      <button class="btn btn-ghost btn-sm" data-insert="`|`">代码</button>
      <button class="btn btn-ghost btn-sm" data-insert="~~|~~">删除线</button>
      <button class="btn btn-ghost btn-sm" data-insert="[|](url)">链接</button>
      <button class="btn btn-ghost btn-sm" data-insert="![|](url)">图片</button>
      <button class="btn btn-ghost btn-sm" data-insert="# |">标题</button>
      <button class="btn btn-ghost btn-sm" data-insert="> |">引用</button>
      <button class="btn btn-ghost btn-sm" data-insert="- |">列表</button>
      <button class="btn btn-ghost btn-sm" id="disc-img-btn">插入图盘图片</button>
      <div class="toolbar-divider"></div>
      <button class="btn btn-ghost btn-sm" id="color-btn" title="插入彩色文本">
        <svg class="icon" viewBox="0 0 24 24" width="14" height="14"><path d="M12 3a9 9 0 000 18c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16a5 5 0 005-5c0-4.42-4.03-8-9-8zm-5.5 9a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm3-4a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm5 0a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm3 4a1.5 1.5 0 110-3 1.5 1.5 0 010 3z"/></svg>
        颜色
      </button>
      <button class="btn btn-ghost btn-sm" id="code-btn" title="插入代码块">
        <svg class="icon" viewBox="0 0 24 24" width="14" height="14"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
        长代码
      </button>
      <button class="btn btn-ghost btn-sm" id="iframe-btn" title="插入嵌入式页面">
        <svg class="icon" viewBox="0 0 24 24" width="14" height="14"><path d="M19 4H5a2 2 0 00-2 2v12a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2zm0 14H5V8h14v10zM7 10h4v2H7v-2zm0 3h4v2H7v-2zm6-3h4v2h-4v-2z"/></svg>
        Iframe
      </button>
      <input type="file" id="img-input" accept="image/*" hidden>
    </div>

    <div class="editor-tabs">
      <button class="tab active" data-mode="edit">编辑</button>
      <button class="tab" data-mode="preview">预览</button>
    </div>

    <textarea id="p-content" class="editor-textarea" placeholder="支持 Markdown"></textarea>
    <div id="p-preview" class="markdown-body editor-preview" hidden></div>
  </section>
</main>

<script type="module" src="./src/js/common/theme.js"></script>
<script type="module" src="./src/js/common/nav.js"></script>
<script type="module" src="./src/js/publish-post.js"></script>
</body>
</html>
